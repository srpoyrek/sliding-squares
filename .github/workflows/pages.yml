# Verify the solver, build the reports, publish them to GitHub Pages.
#
# Nothing generated is committed: `plots/` is built here on every push, so the
# published site always matches the code at HEAD rather than whenever someone
# last remembered to commit an artifact. That is the same rule the repo applies
# locally — generated output is regenerated, never stored.
#
# Pages must be enabled once, under Settings -> Pages -> Source: GitHub Actions.
name: reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Lint
        # Via pre-commit, not a bare `ruff`, so CI uses the exact version pinned
        # in .pre-commit-config.yaml. Installing ruff from requirements.txt gave
        # CI a newer release than the pinned hook, and the two formatters
        # disagreed about implicit string concatenation — a diff no local commit
        # could produce, and one that would flip back and forth if "fixed".
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Tests
        run: python -m pytest -q

  build:
    # Only build the site once the suite passes, so a broken simplification
    # cannot publish a report that looks authoritative.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Solve every test case and write its report
        run: python run_tests.py --simplified
      - name: Compare the BFS searches against each other
        # Runs before make_gallery.py, which links the benchmark from the
        # landing page only when the page is already on disk.
        #
        # A shared runner is not a benchmarking machine, so the timings here are
        # indicative; `states` is exact and reproducible, and the switch-count
        # cross-check between the three searches is the part that must hold. The
        # timeout keeps the unidirectional search — which expands to depth D
        # rather than D/2 — from stalling the workflow on the larger cases.
        run: python benchmark_bfs.py --repeat 2 --timeout 180
      - name: Render the recipe gallery and the landing page
        run: python make_gallery.py
      - name: Disable Jekyll so no path is filtered
        run: touch plots/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: plots

  deploy:
    # Pushes to main only: a pull request gets the verify + build signal without
    # replacing what is live.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
